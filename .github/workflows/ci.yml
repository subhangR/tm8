# tm8 CI — the merge gate, split into parallel jobs.
#
# Every job runs the SAME gate script the pre-push hook runs, tools/ci/check.sh,
# narrowed with `--only <stage>,...` (and `--shard i/n` for the two big suites).
# Stages are always named one by one, never as a bare group (`test`,
# `typecheck`): under a group a stage that would skip stays a reported skip, while
# a stage named on its own that would skip turns the job red.
#
# Jobs:
#   changes          which modules this run affects (tools/ci/changes.sh; Wave 2)
#   ci-scripts       the affected / changes / ci-ok table tests
#   typecheck        every scoped `tsc -b` project + the UI typecheck
#   test-server x4   packages/server, sharded            (postgres)
#   test-cli         packages/cli                        (postgres)
#   test-execution   packages/execution
#   test-ui x2       packages/tm8-ui, sharded
#   test-small       packages/contract, packages/jev, tools/conformance
#   migrations       clean apply of db/migrations on its own password-auth postgres
#   ci-ok            the one stable check name (tools/ci/ci-ok.sh)
#
# PATH FILTERING (Wave 2). On pull_request, `changes` diffs the PR merge commit
# (HEAD^1..HEAD) through tools/ci/affected.sh and each test job runs only when its
# module is affected; typecheck and ci-scripts always run. push, schedule and
# workflow_dispatch are ALL, and so is any error inside changes.sh (loudly: a
# ::warning:: and reason "fallback: <why>"). ci-shadow.yml calls this file with
# force_all: true to run the full gate beside the filtered one.
#
# BUILD LISTS ARE LITERAL. A test job's `typecheck:<project>` stages are its build
# step (`tsc -b` emits dist), and `tsc -b <pkg>` alone does NOT build everything
# its suites load at runtime: packages/execution's tsconfig never references the
# cli, yet codex-loopback.integration.test.ts executes packages/cli/dist and turns
# itself into describe.skip when that dist is missing; the cli integration
# harness spawns packages/server/dist, which the cli's references never build.
# So each job names what it builds (design §2 table), and a job's list only ever
# grows with a reason.
#
# "Never a parallel vite build / sequential tsc" is a SAME-MACHINE rule: two vite
# builds or two tsc -b runs in one checkout SIGTERM each other or race on dist/.
# Separate jobs are separate runners with separate checkouts, so running them in
# parallel does not break it. Inside one job check.sh still runs every stage
# sequentially, in its own fixed order.
#
# Every job writes vitest's JSON report (TM8_VITEST_JSON_DIR) as a short-lived
# artifact, so a run's test-ID/status set can be diffed: against the old monolith
# (Wave 1's proof), between shards, and for shard rebalancing.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly full run of main (schedule only ever runs on the default branch).
    - cron: "17 3 * * *"
  # ci-shadow.yml's full gate. Inside a called workflow `github.event_name` is the
  # CALLER's (pull_request), so force_all is what tells changes.sh to emit ALL.
  workflow_call:
    inputs:
      force_all:
        description: Run every job whatever the diff (ci-shadow.yml's full gate).
        type: boolean
        default: false

# Only a pull_request run is ever cancelled, by a newer push to the same PR.
# cancel-in-progress:false alone is not enough to protect main: GitHub still
# replaces a PENDING run in the same group, so three quick merges would drop the
# middle one. Every non-PR run therefore gets a group of its own (its run_id).
# github.workflow is part of the key because groups are repo-wide, not
# per-workflow. Inside a workflow_call `github.workflow` is the CALLER's name, so
# the 'full'/'filtered' part keeps ci-shadow's call ("ci-shadow-full-<ref>") apart
# from its caller ("ci-shadow-<ref>", which would otherwise deadlock) and from this
# file's own PR run ("ci-filtered-<ref>").
concurrency:
  group: ${{ github.workflow }}-${{ inputs.force_all && 'full' || 'filtered' }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only token: no job here writes to the repo (artifacts use the runtime token).
# A caller (ci-shadow.yml) can only narrow this, never widen it.
permissions:
  contents: read

# node / bun versions live in ONE place: the tm8-setup composite's input defaults.

env:
  CI: "1"
  TM8_VITEST_JSON_DIR: vitest-reports

jobs:
  # Which modules this run must test. tools/ci/changes.sh: on pull_request (not the shadow)
  # it diffs the PR merge commit HEAD^1..HEAD through tools/ci/affected.sh; every other event
  # is ALL. Any error inside it is ALL too, with a ::warning:: naming the reason. Only a
  # failure of the job itself leaves it non-success, which skips every gated job below and
  # makes ci-ok red — never skip-green.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      all: ${{ steps.affected.outputs.all }}
      modules: ${{ steps.affected.outputs.modules }}
      reason: ${{ steps.affected.outputs.reason }}
      typecheck: ${{ steps.affected.outputs.typecheck }}
      server: ${{ steps.affected.outputs.server }}
      cli: ${{ steps.affected.outputs.cli }}
      execution: ${{ steps.affected.outputs.execution }}
      ui: ${{ steps.affected.outputs.ui }}
      small: ${{ steps.affected.outputs.small }}
      migrations: ${{ steps.affected.outputs.migrations }}
    steps:
      # depth 2: the merge commit and both its parents, which is all HEAD^1..HEAD reads
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Affected modules
        id: affected
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL: ${{ inputs.force_all }}
          EXPECTED_SHA: ${{ github.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          # logged so the concurrency comment above is checkable from a run: inside
          # ci-shadow's call this prints the CALLER's name, "ci-shadow"
          WORKFLOW: ${{ github.workflow }}
        run: |
          echo "github.workflow=$WORKFLOW force_all=$FORCE_ALL event=$EVENT_NAME"
          bash tools/ci/changes.sh > "$RUNNER_TEMP/affected"
          cat "$RUNNER_TEMP/affected"
          cat "$RUNNER_TEMP/affected" >> "$GITHUB_OUTPUT"

  # The table tests of the scripts this workflow's gating depends on (W2-4). Every run,
  # required by ci-ok: it is what stops a MODULE_OF/EXTRA_EDGES or ci-ok regression merging.
  ci-scripts:
    name: ci scripts (affected / changes / ci-ok table tests)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: affected.sh table test
        run: bash tools/ci/affected.test.sh
      - name: changes.sh + ci-ok.sh table test
        run: bash tools/ci/ci-ok.test.sh

  # Always runs, gated on nothing: every module's build depends on it.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
      - name: Typecheck
        run: >-
          bash tools/ci/check.sh --only
          typecheck:packages/contract,typecheck:packages/jev,typecheck:packages/mcp,typecheck:packages/server,typecheck:packages/execution,typecheck:packages/cli,typecheck:tools/conformance,typecheck:packages/tm8-ui

  test-server:
    name: test-server (${{ matrix.shard }}/4)
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        # Same pin as the `migrations` job below — see the note there.
        image: postgres:17
        env:
          # TRUST, not a password — unlike the `migrations` job, which only ever
          # connects as the one role in its own URL. These suites connect as
          # roles the MIGRATIONS create (`tm8_app`, `tm8_delivery_worker`) to
          # prove the grant boundary, and they build those connections with an
          # EMPTY password on purpose: db/migrations/015 grants CONNECT and never
          # sets one, so a trust cluster is the configuration they describe
          # (packages/server/test/db/delivery-principal.ts:70). Under scram every
          # one of those probes dies as `SASL: client password must be a string`
          # — a red that says nothing about the grant it meant to test.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: tm8
          POSTGRES_DB: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U tm8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
        with:
          postgres: "true"
      # Builds: packages/server (its references cover mcp, jev, execution, prompt, contract).
      - name: Gate
        run: bash tools/ci/check.sh --only typecheck:packages/server,test:packages/server --shard ${{ matrix.shard }}/4
        env:
          # Read by BOTH scratch-database helpers: packages/server's w1-pg.ts
          # (2nd of 3 fallbacks) and packages/cli's integration harness. It is
          # deliberately NOT TM8_DATABASE_URL — several suites skip themselves by
          # name on that variable, and setting it would silently enlist tests that
          # are meant to be opt-in. No password, matching the trust cluster above.
          TM8_MIGRATION_DATABASE_URL: postgres://tm8@127.0.0.1:5442/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-json-test-server-${{ matrix.shard }}
          path: vitest-reports/
          retention-days: 7
          if-no-files-found: error

  test-cli:
    name: test-cli
    needs: changes
    if: needs.changes.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # Same pin and TRUST auth as test-server — see the note there.
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: tm8
          POSTGRES_DB: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U tm8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
        with:
          postgres: "true"
      # Builds: packages/cli AND packages/server — the integration harness spawns
      # packages/server/dist, which the cli's own references never build.
      - name: Gate
        run: bash tools/ci/check.sh --only typecheck:packages/server,typecheck:packages/cli,test:packages/cli
        env:
          # Same variable, same reason as test-server; NOT TM8_DATABASE_URL.
          TM8_MIGRATION_DATABASE_URL: postgres://tm8@127.0.0.1:5442/postgres
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-json-test-cli
          path: vitest-reports/
          retention-days: 7
          if-no-files-found: error

  test-execution:
    name: test-execution
    needs: changes
    if: needs.changes.outputs.execution == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
      # Builds: packages/execution AND packages/cli — codex-loopback.integration
      # executes packages/cli/dist/index.js and skips itself when it is missing.
      - name: Gate
        run: bash tools/ci/check.sh --only typecheck:packages/execution,typecheck:packages/cli,test:packages/execution
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-json-test-execution
          path: vitest-reports/
          retention-days: 7
          if-no-files-found: error

  test-ui:
    name: test-ui (${{ matrix.shard }}/2)
    needs: changes
    if: needs.changes.outputs.ui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
      # Builds: packages/cli (emits the contract, prompt and cli dists the UI's
      # imports resolve through), then the UI typecheck.
      - name: Gate
        run: bash tools/ci/check.sh --only typecheck:packages/cli,typecheck:packages/tm8-ui,test:packages/tm8-ui --shard ${{ matrix.shard }}/2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-json-test-ui-${{ matrix.shard }}
          path: vitest-reports/
          retention-days: 7
          if-no-files-found: error

  test-small:
    name: test-small
    needs: changes
    if: needs.changes.outputs.small == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
      # Builds: packages/contract, packages/jev, tools/conformance.
      - name: Gate
        run: >-
          bash tools/ci/check.sh --only
          typecheck:packages/contract,typecheck:packages/jev,typecheck:tools/conformance,test:packages/contract,test:packages/jev,test:tools/conformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vitest-json-test-small
          path: vitest-reports/
          retention-days: 7
          if-no-files-found: error

  migrations:
    name: migrations apply clean
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PIN: keep this aligned with the sidecar major settled in
        # docs/ops/SIDECAR-PACKAGING.md. A drift between CI and the shipped sidecar
        # is exactly the class of bug the migration gate exists to catch.
        #
        # PASSWORD auth and NO role pre-create, on purpose, and never merged with
        # the trust service above: roles are cluster-global, so pre-created roles
        # would turn 001/015's CREATE ROLE paths into no-ops and this clean-apply
        # gate would pass without proving the migrations create their own roles.
        # Hence tm8-setup with postgres "false" (its default) here.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tm8
          POSTGRES_USER: tm8
          POSTGRES_DB: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U tm8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/tm8-setup
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Migration gate
        run: bash tools/ci/migrations-check.sh
        env:
          TM8_MIGRATION_DATABASE_URL: postgres://tm8:tm8@localhost:5442/postgres

  # The one check to require. `if: always()` — never `!cancelled()`, under which a
  # cancelled run leaves this job skipped, and a skipped check reads as passing.
  # The verdict is tools/ci/ci-ok.sh (table-tested in ci-scripts): red unless
  # `changes` succeeded with a non-empty, parseable module set, and every job whose
  # module is affected succeeded. A skipped job passes ONLY when its module is
  # unaffected; failure and cancelled are always red. Non-PR events and the shadow
  # must be all=true. The needs list is pinned in ci-ok.sh (PINNED_COUNT and its job
  # map), so dropping or adding a job here without it is red too.
  ci-ok:
    name: ci-ok
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: always()
    needs: [changes, ci-scripts, typecheck, test-server, test-cli, test-execution, test-ui, test-small, migrations]
    steps:
      - uses: actions/checkout@v4
      - name: Verdict
        # needs and inputs reach the script through env only, never inlined in run:
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT_NAME: ${{ github.event_name }}
          FORCE_ALL: ${{ inputs.force_all }}
        # An unspecified `run` shell is `bash -e` WITHOUT pipefail: without the set,
        # tee's status would be the step's and a red verdict would pass.
        run: |
          set -o pipefail
          bash tools/ci/ci-ok.sh | tee -a "$GITHUB_STEP_SUMMARY"
