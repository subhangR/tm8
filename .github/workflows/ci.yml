# tm8 CI — the merge gate.
#
# This file is ready for the day tm8 gains a remote; until then the same gate runs
# locally via `bun run check` (and optionally as a pre-push hook: `bun run hooks:install`).
#
# Two jobs on purpose:
#   check       — install + per-package scoped `tsc -b` + vitest, against a real Postgres.
#   migrations  — the same script against a real Postgres service container.
#
# The `check` job carried "No database needed" from the day it was written, and it
# stopped being true long before anyone noticed: ~92 test files across
# packages/server and packages/cli create a scratch database per suite and had been
# dying on `ECONNREFUSED 127.0.0.1:5442` on EVERY commit, main included. They are
# the tests that see plpgsql rules a FakeDb cannot, so skipping them is not an
# option — the job gets the same service container the migrations job has.
#
# Deliberately NOT here: any parallel vite build. The UI (W3/M2) gets ONE build step
# inside the `check` job when it lands — concurrent vite builds SIGTERM each other.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # packages/server + packages/execution run under node (node-pty is broken under bun).
  NODE_VERSION: "22"
  BUN_VERSION: "1.2.x"

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    # 20 -> 45. The suites this job could never run are DB-backed: each creates a
    # scratch database and applies the whole migration chain before it asserts
    # anything. The full gate measures ~12 minutes of tests on a fast local box
    # with a warm cluster; a 2-core runner is several times that, and a job
    # killed by its own timeout is a red that reads exactly like a real failure.
    timeout-minutes: 45
    services:
      postgres:
        # Same pin as the `migrations` job below — see the note there.
        image: postgres:17
        env:
          # TRUST, not a password — unlike the `migrations` job, which only ever
          # connects as the one role in its own URL. These suites connect as
          # roles the MIGRATIONS create (`tm8_app`, `tm8_delivery_worker`) to
          # prove the grant boundary, and they build those connections with an
          # EMPTY password on purpose: db/migrations/015 grants CONNECT and never
          # sets one, so a trust cluster is the configuration they describe
          # (packages/server/test/db/delivery-principal.ts:70). Under scram every
          # one of those probes dies as `SASL: client password must be a string`
          # — a red that says nothing about the grant it meant to test.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: tm8
          POSTGRES_DB: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U tm8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # The scratch-database helpers shell out to `psql` to apply migrations
      # (packages/server/test/db/w1-pg.ts, packages/cli/test/integration/harness.ts).
      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # packages/execution's worktree-manager suite runs `git merge` in a scratch
      # repository. A bare runner has no committer identity, so the merge dies with
      # "empty ident name" — a red test that says nothing about the code.
      - name: Configure git identity for worktree tests
        run: |
          git config --global user.email "ci@tm8.invalid"
          git config --global user.name "tm8 CI"

      - name: Cache bun install
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      # --no-migrations skips the migration apply (the `migrations` job owns it)
      # but still does install, every scoped tsc -b, and every package's vitest
      # suite. Do NOT use --fast here: it ALSO skips install, and a fresh runner
      # has no node_modules, so every later stage dies as `vitest: command not
      # found` / `Cannot find module '@tm8/contract'` — which is exactly how this
      # job failed on every commit until 2026-08-02.
      - name: Gate
        run: bash tools/ci/check.sh --no-migrations
        env:
          CI: "1"
          # Read by BOTH scratch-database helpers: packages/server's w1-pg.ts
          # (2nd of 3 fallbacks) and packages/cli's integration harness. It is
          # deliberately NOT TM8_DATABASE_URL — several suites skip themselves by
          # name on that variable, and setting it would silently enlist tests that
          # are meant to be opt-in. No password, matching the trust cluster above.
          TM8_MIGRATION_DATABASE_URL: postgres://tm8@127.0.0.1:5442/postgres

  migrations:
    name: migrations apply clean
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PIN: keep this aligned with the sidecar major settled in
        # docs/ops/SIDECAR-PACKAGING.md. A drift between CI and the shipped sidecar
        # is exactly the class of bug the migration gate exists to catch.
        image: postgres:17
        env:
          POSTGRES_PASSWORD: tm8
          POSTGRES_USER: tm8
          POSTGRES_DB: postgres
        ports:
          - 5442:5432
        options: >-
          --health-cmd "pg_isready -U tm8"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install postgres client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Migration gate
        run: bash tools/ci/migrations-check.sh
        env:
          CI: "1"
          TM8_MIGRATION_DATABASE_URL: postgres://tm8:tm8@localhost:5442/postgres
