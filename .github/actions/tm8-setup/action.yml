# tm8-setup — the per-job setup every tm8 CI job shares.
#
#   - uses: ./.github/actions/tm8-setup
#     with:
#       postgres: "true"      # only in a job that declares the trust-auth postgres service
#
# Does, in the order ci.yml's `check` job did them: bun, node, [psql client],
# git identity, [cluster-role pre-create], bun cache, `bun install --frozen-lockfile`.
#
# What it CANNOT do: declare `services:`. A composite action has no services, so
# every postgres job still carries its own postgres block (trust auth, with the
# comment that explains why) — see ci.yml.
#
# NOT FOR THE MIGRATIONS JOB with postgres: "true". Its service uses password
# auth, and worse, pre-created roles would turn 001/015's CREATE ROLE paths into
# no-ops, so the clean-apply gate would stop proving the migrations create their
# own roles. That job keeps postgres at its default "false" (or skips this action).
#
# INSTALL OWNERSHIP: this action owns `bun install` for every job that uses it.
# Such a job calls `tools/ci/check.sh --only <stages>` and must NOT select the
# `install` stage too, or it installs twice. The no-flag paths (pre-push hook,
# `bun run check`) keep check.sh's own install stage, unchanged.
#
# `postgres` is a STRING input: `if: inputs.postgres` would be true for "false"
# (any non-empty string is truthy), so every gate compares with == 'true'.

name: tm8-setup
description: bun + node + bun cache + frozen install + git identity; optionally the psql client and the cluster-role pre-create.

inputs:
  postgres:
    description: '"true" to install the psql client and pre-create the cluster-global roles. Needs a postgres service at pg-url.'
    required: false
    default: "false"
  pg-url:
    description: Superuser URL of the job's postgres service (trust auth, no password).
    required: false
    default: postgres://tm8@127.0.0.1:5442/postgres
  node-version:
    description: node major. packages/server + packages/execution run under node (node-pty is broken under bun).
    required: false
    default: "22"
  bun-version:
    required: false
    default: "1.2.x"

runs:
  using: composite
  steps:
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    # The scratch-database helpers shell out to `psql` to apply migrations
    # (packages/server/test/db/w1-pg.ts, packages/cli/test/integration/harness.ts).
    - name: Install postgres client
      if: inputs.postgres == 'true'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y postgresql-client

    # packages/execution's worktree-manager suite runs `git merge` in a scratch
    # repository. A bare runner has no committer identity, so the merge dies with
    # "empty ident name" — a red test that says nothing about the code.
    - name: Configure git identity for worktree tests
      shell: bash
      run: |
        git config --global user.email "ci@tm8.invalid"
        git config --global user.name "tm8 CI"

    # ONCE, SINGLE-THREADED, BEFORE ANY SUITE RUNS. Roles are CLUSTER-global
    # while scratch databases are per-suite, and `001_core_graph.sql:37` guards
    # its `create role` with `if not exists` — which is check-then-act, not
    # atomic. A dozen vitest workers applying 001 at the same moment on a FRESH
    # cluster all pass the check and one loses the insert:
    #   ERROR: duplicate key value violates unique constraint "pg_authid_rolname_index"
    # It cannot be fixed in 001: that file is applied on every existing database
    # and `db/migrate.mjs` refuses a checksum that moved after it was applied.
    # Creating the roles up front satisfies the `if not exists` guard for every
    # worker, which is exactly the state a developer's long-lived cluster is
    # already in — and why this never reproduced off a fresh one.
    # (Moved verbatim from ci.yml; only the URL became the pg-url input.)
    - name: Pre-create cluster-global roles (001/015) to de-race parallel suites
      if: inputs.postgres == 'true'
      shell: bash
      run: |
        psql "${{ inputs.pg-url }}" -v ON_ERROR_STOP=1 -c "
          do \$\$
          begin
            if not exists (select 1 from pg_roles where rolname = 'tm8_graph_owner') then
              create role tm8_graph_owner nologin noinherit;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'tm8_app') then
              create role tm8_app login;
            end if;
            if not exists (select 1 from pg_roles where rolname = 'tm8_delivery_worker') then
              create role tm8_delivery_worker login noinherit nosuperuser nocreatedb
                nocreaterole noreplication nobypassrls;
            end if;
          end
          \$\$;"

    - name: Cache bun install
      uses: actions/cache@v4
      with:
        path: ~/.bun/install/cache
        key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
        restore-keys: ${{ runner.os }}-bun-

    - name: Install dependencies (frozen lockfile)
      shell: bash
      run: bun install --frozen-lockfile
