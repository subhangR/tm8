<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tm8 · Sign in</title><link rel="stylesheet" href="/app.css"><script src="/app.js" defer></script></head>
<body><main><h1>tm8</h1><p>Your spaces, projects and workspace.</p>
<section id="login"><h2>Sign in or sign up</h2><p>Continue with your GitHub account. New accounts need an invitation.</p>
<label>Invitation code <small>Required on your first visit</small><input name="invitationCode" autocomplete="off"></label>
<button id="github" type="button">Continue with GitHub</button></section>
<section id="signed-in" hidden><p id="account"></p><button id="open-workspace">Open my workspace</button><button id="link-github">Link GitHub for sign-in</button><button id="logout">Sign out</button></section>
<section id="admin" hidden><h2>Machines</h2><div id="machines"></div>
<form id="machine-form"><label>Name<input name="name" required maxlength="100"></label><label>Public origin<input name="publicOrigin" type="url" required placeholder="https://node.example.com"></label><label>Provider<select name="provider"><option>local</option><option>aws</option><option>azure</option><option>utho</option><option>other</option></select></label><label>User capacity<input name="capacity" type="number" min="1" max="10000" value="10" required></label><button>Register machine</button></form>
<h2>Invite a user</h2><form id="invite-form"><label>Email<input name="email" type="email" required></label><button>Create invitation</button></form></section>
<p id="status" role="status" aria-live="polite"></p><pre id="result"></pre></main></body></html>
