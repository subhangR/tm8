# Loaded in nginx's `http {}` context. Secrets and query strings are omitted
# from the access format by construction.
map $http_upgrade $tm8_connection_upgrade {
  default upgrade;
  ''      close;
}

log_format tm8_noargs '$remote_addr - $remote_user [$time_local] '
                       '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                       '"$http_user_agent"';

limit_req_zone  $binary_remote_addr zone=tm8_ws_upgrade:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=tm8_ws_client:10m;

# The credential surface. The node limits these itself, per client and per
# account (packages/server/src/http/auth-rate-limit.ts) — this is the edge
# half of the same defence, and it is worth having because it refuses a flood
# before it costs the node a connection or a JSON parse. Deliberately looser
# than the app limiter so the app's per-account rule stays the one that speaks.
limit_req_zone  $binary_remote_addr zone=tm8_auth:10m rate=5r/s;
