[Service]
# Artifact previews on their own public origin (TM8-ARTIFACTS-DESIGN §9.2).
#
# Reference copy of what /etc/tm8/prod.env carries on the Utho box. The three
# variables are three DIFFERENT facts and none can be derived from another:
#
#   TM8_PREVIEW_PUBLIC_ORIGIN  what a BROWSER reaches previews at. Minted into
#                              previewUrl and into every CSP source list. The
#                              name the proxy forwards in `Host`, which the
#                              preview listener compares against per request.
#   TM8_PREVIEW_PORT           the LOOPBACK socket the second listener binds,
#                              and the only thing nginx should be pointed at.
#                              Never appears in a URL a browser sees.
#   TM8_PREVIEW_FRAME_ANCESTORS the origin allowed to FRAME a preview — the
#                              app's public origin, because the document doing
#                              the embedding is the tm8 UI at https://tm8.sh.
#
# Deleting these three does not disable previews — it silently returns them to
# the same-origin `/p/` route on the app socket, i.e. untrusted bundle HTML on
# the origin that holds `__Host-tm8-session`. On a node with TM8_ENV=prod and
# an https TM8_PUBLIC_ORIGIN that combination is now a BOOT REFUSAL rather
# than a working server, which is the point of setting TM8_PUBLIC_ORIGIN here.
Environment=TM8_PREVIEW_ENABLED=1
Environment=TM8_PREVIEW_PUBLIC_ORIGIN=https://artifacts.tm8.sh
Environment=TM8_PREVIEW_PORT=17778
Environment=TM8_PREVIEW_FRAME_ANCESTORS=https://tm8.sh
Environment=TM8_PUBLIC_ORIGIN=https://tm8.sh

# artifacts.tm8.sh must NOT appear here, and tm8.sh must NOT appear as the
# preview host. The app socket answering to the preview name (or the reverse)
# makes the origin split cosmetic; loadConfig refuses both at boot rather than
# partitioning silently (§9.3).
Environment=TM8_ALLOWED_HOSTNAMES=tm8-server.tail28ac62.ts.net,tm8.sh
