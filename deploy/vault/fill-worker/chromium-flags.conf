# Reference copy of src/browser/chromium-flags.ts. The worker owns its fixed list.
# Never enable a TCP debugging endpoint; Playwright uses its private pipe.
# Block all extensions.
--disable-extensions
# Block bundled extension background pages.
--disable-component-extensions-with-background-pages
# Suppress background browser services and telemetry.
--disable-background-networking
# Suppress account synchronization.
--disable-sync
# Disable Breakpad crash artifacts.
--disable-breakpad
# Disable alternate crash reporting.
--disable-crash-reporter
# Disable HTTP disk cache.
--disk-cache-size=0
# Disable media disk cache.
--media-cache-size=0
# Suppress first-run profile import and UI.
--no-first-run
# Suppress default browser checks.
--no-default-browser-check
# Avoid integration with the host credential store.
--password-store=basic
# Avoid the platform keychain.
--use-mock-keychain
# Disable discovery, remote autofill and password onboarding services.
--disable-features=MediaRouter,OptimizationHints,AutofillServerCommunication,PasswordManagerOnboarding
# Never offer to persist the filled password.
--disable-save-password-bubble
